services:
  pymera-debian-test:
    image: python:3.11-slim
    volumes:
      - ./pymera.nim:/app/pymera.nim:ro
    working_dir: /app
    command: python3 pymera.nim
    environment:
      - PYTHONUNBUFFERED=1
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GH_TOKEN=${GH_TOKEN:-}

  pymera-alpine-test:
    image: python:3.11-alpine
    volumes:
      - ./pymera.nim:/app/pymera.nim:ro
    working_dir: /app
    command: python3 pymera.nim
    environment:
      - PYTHONUNBUFFERED=1

  pymera-ruff-test:
    image: python:3.11-alpine
    volumes:
      - ./pymera.nim:/app/pymera.nim:ro
    working_dir: /app
    command: sh -c "pip install --quiet ruff && ruff check pymera.nim && ruff format --diff --check pymera.nim && echo '✅ Ruff check and format passed - code is clean'"
    environment:
      - PYTHONUNBUFFERED=1

  # Fails because of https://github.com/psf/black/issues/1245
  pymera-black-test:
    image: python:3.11-alpine
    volumes:
      - .:/app:ro
    working_dir: /app
    command: sh -c "pip install --quiet black && black --check --diff --extend-exclude='pymera\.nim|shymera\.nim' . && echo '✅ Black format check passed - dual-language files excluded'"
    environment:
      - PYTHONUNBUFFERED=1

  # Fails for similar reason to black
  pymera-nph-test:
    image: nimlang/nim:2.2.0-alpine
    volumes:
      - ./pymera.nim:/app/pymera.nim:ro
    working_dir: /app
    command: sh -c "nimble install -y nph >/dev/null 2>&1 && echo 'WARNING - nph cannot format dual-language files' && echo 'The fmt off directive does not protect Nim comment syntax' && echo 'Recommendation - exclude pymera.nim and shymera.nim from nph formatting' && exit 0"

  shymera-debian-test:
    image: debian:bookworm-slim
    volumes:
      - ./shymera.nim:/app/shymera.nim:ro
    working_dir: /app
    command: sh shymera.nim
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GH_TOKEN=${GH_TOKEN:-}

  shymera-alpine-test:
    image: alpine:latest
    volumes:
      - ./shymera.nim:/app/shymera.nim:ro
    working_dir: /app
    command: sh shymera.nim

  shymera-shellcheck-shfmt-test:
    image: alpine:latest
    volumes:
      - ./shymera.nim:/app/shymera.nim:ro
    working_dir: /app
    command: sh -c "apk add --quiet shellcheck shfmt && shellcheck shymera.nim && shfmt -d shymera.nim && echo '✅ shellcheck and shfmt passed - code is clean'"
